name: Research Skill regression tests
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/research-skill-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/research-skill-tests.yml"
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run existing regression tests and formal-final gate tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
